name: radar
# Scheduled runs are registered by GitHub when this file changes on the default branch.

on:
  schedule:
    # Every hour at :07 UTC. The script itself decides whether to work: hourly during
    # peak season (config.yaml schedule.peak_until), every N hours after that.
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Ignore the schedule gate"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

# Serialise with the digest workflow so both never push at the same time.
concurrency:
  group: radar-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch, screen, classify, alert
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RADAR_PRIVATE_CONFIG_B64: ${{ secrets.RADAR_PRIVATE_CONFIG_B64 }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            python -m radar run --force
          else
            python -m radar run
          fi

      - name: Commit state and dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "radar: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git push
