# Companies to watch.
#
#   name:     display name; also used to match postings from the community lists
#   aliases:  other spellings the community lists use for the same company
#   tier:     1 = instant alert issue when a new eligible posting appears; 2 = digest only
#   ats:      hiring platform to poll directly. One of:
#               greenhouse | ashby | lever | smartrecruiters | workday | amazon | apple | eightfold | none
#             "none" means the company's site can't be polled without a browser;
#             its postings still arrive through the Simplify and speedyapply lists.
#   token:    board identifier for greenhouse / ashby / lever / smartrecruiters
#   workday:  {host, tenant, site} for Workday sites
#   eightfold: {host, domain, variant}  variant is "pcsx" (Microsoft) or "apply_v2" (Netflix)
#   level_exception: true if a "II" title is the new-grad level at this company
#
# Add a company with:  python -m radar add-company "Company Name" --tier 1
# (it probes Greenhouse, Ashby, Lever and SmartRecruiters for the board id)

- name: Amazon
  aliases: [AWS, Amazon Web Services, Amazon.com]
  tier: 1
  ats: amazon

- name: Google
  aliases: [Alphabet, YouTube, DeepMind, Google DeepMind]
  tier: 1
  ats: none

